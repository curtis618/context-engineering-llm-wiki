<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --paper:#f7f2e8; --ink:#1c2b30; --muted:#5a696e; --accent:#0e6a62; --warm:#bf5327;
  --card:#fffdf8; --line:#dcd3c1; --backdrop:#1f2c2c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--backdrop)}
body{display:grid;place-items:center;overflow:hidden;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;line-height:1.55}
.deck{--w:min(100vw,calc(100vh*16/9));--w:min(100vw,calc(100dvh*16/9));
  width:var(--w);height:calc(var(--w)*9/16);font-size:calc(var(--w)/64);position:relative;background:var(--paper)}
.slide{position:absolute;inset:0;display:none;background:var(--paper);flex-direction:column;padding:2.4em 3.6em 1.3em;overflow:hidden}
.slide.on{display:flex}
header{flex:none;margin-bottom:1.1em}
.stage{display:inline-block;font-size:.78em;font-weight:700;letter-spacing:.12em;color:var(--accent);
  border:1px solid var(--accent);border-radius:99em;padding:.12em .9em;margin-bottom:.55em}
h2{margin:0;font-size:2.25em;line-height:1.25;font-weight:800;text-wrap:balance}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8em;font-size:1.3em}
.body p{margin:0}
.lead{color:var(--muted);font-size:1.05em}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.55em}
li{position:relative;padding-left:1.3em}
li::before{content:"";position:absolute;left:.15em;top:.62em;width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
strong{color:var(--accent);font-weight:800}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:#ebe4d4;border-radius:.25em;padding:.05em .35em}
.callout{margin-top:auto !important;background:var(--card);border-left:.35em solid var(--warm);
  padding:.5em 1em;border-radius:0 .4em .4em 0;font-weight:600;font-size:.95em}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:.8em}
.gcard{background:var(--card);border:1px solid var(--line);border-top:.3em solid var(--accent);border-radius:.4em;padding:.7em 1em}
.gcard h3{margin:0 0 .25em;font-size:1.05em;color:var(--accent)}
.gcard p{font-size:.88em;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:.84em}
th,td{text-align:left;vertical-align:top;padding:.4em .8em;border-bottom:1px solid var(--line)}
th{color:var(--accent);font-weight:800;border-bottom:2px solid var(--accent)}
td:first-child{font-weight:700;white-space:nowrap}
footer{flex:none;display:flex;justify-content:space-between;gap:1.5em;align-items:flex-end;
  margin-top:.9em;padding-top:.55em;border-top:1px solid var(--line);font-size:.72em;color:var(--muted)}
footer a{color:var(--muted);text-underline-offset:.2em}
footer a:hover{color:var(--accent)}
.pg{white-space:nowrap;font-variant-numeric:tabular-nums}
.layout-cover{justify-content:center;background:linear-gradient(135deg,#0e6a62 0 38%,var(--paper) 38%)}
.layout-cover .body{justify-content:center;gap:1em;padding-left:42%}
.layout-cover h1{margin:0;font-size:2.5em;line-height:1.2;font-weight:900;text-wrap:balance}
.layout-cover footer{border:0}
.hud{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;opacity:.55}
.hud:hover{opacity:1}
.hud button{font:inherit;font-size:18px;width:38px;height:38px;border-radius:50%;border:0;background:#ffffff22;color:#fff;cursor:pointer}
.hud button:focus-visible{outline:2px solid #fff}
.bar{position:fixed;left:0;top:0;height:4px;width:100%;background:#ffffff18}
.bar i{display:block;height:100%;width:0;background:var(--warm);transition:width .2s}
@media print{
  html,body{height:auto;background:#fff;overflow:visible;display:block}
  .deck{width:100%;height:auto;font-size:15px}
  .slide{position:relative;display:flex;height:100vh;page-break-after:always}
  .hud,.bar{display:none}
}
</style>
</head>
<body>
<main class="deck" id="deck">
{{SLIDES}}
</main>
<div class="bar"><i id="bar"></i></div>
<nav class="hud" aria-label="換頁"><button id="prev" aria-label="上一頁">‹</button><button id="next" aria-label="下一頁">›</button></nav>
<script>
const slides=[...document.querySelectorAll('.slide')];let cur=0;
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  history.replaceState(null,'','#'+(cur+1));}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(cur+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(cur-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);});
document.getElementById('deck').addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const r=e.currentTarget.getBoundingClientRect();show(cur+((e.clientX-r.left)<r.width*.3?-1:1));});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)show(cur+(d<0?1:-1));x0=null;});
// 渲染檢查用：回傳內容超出版面的頁碼
window.checkOverflow=function(){const bad=[];const keep=cur;
  slides.forEach((s,k)=>{slides.forEach((t,j)=>t.classList.toggle('on',j===k));
    const b=s.querySelector('.body');
    const vis=slides.filter(t=>getComputedStyle(t).display!=='none').length;
    if(vis!==1)bad.push({slide:k+1,visible:vis});
    if(s.scrollHeight>s.clientHeight+1||s.scrollWidth>s.clientWidth+1||b.scrollHeight>b.clientHeight+1)
      bad.push({slide:k+1,body:b.scrollHeight+'/'+b.clientHeight});});
  show(keep);return bad;};
show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
